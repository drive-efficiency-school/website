<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Efficiver: Free Driving Coach for iPhone & Android (formerly Efficient Driver)</title>

    <!-- Google Fonts - Non-render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap"
      onload="
        this.onload = null
        this.rel = 'stylesheet'
      "
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="Efficiver: Free Driving Coach for iPhone &amp; Android (formerly Efficient Driver)"
    />
    <meta
      name="description"
      content="Efficiver (formerly Efficient Driver) helps you drive more efficiently using only your phone's sensors. Free driving coach for iPhone and Android – no OBD hardware needed."
    />
    <meta
      name="keywords"
      content="Efficiver, Efficient Driver, free driving coach app, fuel saving app, iPhone driving app, Android driving app, eco driving app, fuel efficiency, offline driving coach, no OBD app"
    />
    <meta name="author" content="Efficiver" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.efficiver.com" />
    <!-- Titles are deliberately VERSION-FREE (owner call 2026-07-27): a version in the
         share title goes stale the moment the next release ships, and these tags are
         cached by every social scraper. Version-specific news belongs in the description
         (cheap to update) and on the Releases page. -->
    <meta
      property="og:title"
      content="Efficiver: your on-device driving coach for iPhone & Android"
    />
    <meta
      property="og:description"
      content="Drive more efficiently using only your phone's sensors — no OBD hardware. Live efficiency scoring on iPhone and Android, CarPlay and an Apple Watch companion — Trends, forecast and AI insights are coming with Efficiver Pro. No ads or third-party analytics. Drive records are not sent to Efficiver unless you opt into Fleet; platform sync, backup, maps and weather data flows are explained in our Privacy Policy."
    />
    <meta property="og:image" content="https://www.efficiver.com/og-image.png" />
    <meta property="og:site_name" content="Efficiver" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.efficiver.com" />
    <meta
      name="twitter:title"
      content="Efficiver: your on-device driving coach for iPhone & Android"
    />
    <meta
      name="twitter:description"
      content="Drive more efficiently using only your phone's sensors — no OBD hardware. Live scoring on iPhone and Android, CarPlay and an Apple Watch companion — Trends and forecast are coming with Efficiver Pro. No ads or third-party analytics. Drive records are not sent to Efficiver unless you opt into Fleet; platform sync, backup, maps and weather flows are in our Privacy Policy."
    />
    <meta name="twitter:image" content="https://www.efficiver.com/og-image.png" />

    <!-- Additional SEO -->
    <link rel="canonical" href="https://www.efficiver.com" />
    <meta name="robots" content="%ROBOTS%" />
    <meta name="theme-color" content="#6366f1" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "Efficiver",
        "operatingSystem": "iOS, Android",
        "applicationCategory": "LifestyleApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Efficiver - the free driving coach app for iPhone and Android. Phone sensors only, no OBD hardware needed.",
        "screenshot": "https://www.efficiver.com/og-image.png",
        "softwareVersion": "1.5",
        "author": {
          "@type": "Organization",
          "name": "Efficiver",
          "url": "https://www.efficiver.com"
        }
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
